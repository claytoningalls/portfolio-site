    <script>
    (function(){
      const select = document.getElementById('photo-category');
      const items = Array.from(document.querySelectorAll('.photo-item'));

      function filterPhotos() {
        const val = (select.value || '').toLowerCase();
        items.forEach(item => {
          const img = item.querySelector('img');
          const cat = (img?.dataset.category || '').toLowerCase();
          item.style.display = (val === 'all' || cat === val) ? '' : 'none';
        });
      }

      select.addEventListener('change', filterPhotos);
      // apply on load
      filterPhotos();
    })();
    </script>
